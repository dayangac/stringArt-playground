<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>String Art</title>
<style>
  :root {
    --ink: #14110f;
    --dim: #6b625a;
    --paper: #f6f3ee;
    --line: #d8d0c4;
    --thread: #b4471f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: .9rem 1.1rem;
    font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    gap: .7rem;
    overflow: hidden;              /* the whole app lives on one screen */
  }

  header { display: flex; align-items: baseline; gap: .8rem; flex: none; }
  h1 { font-size: 1.15rem; letter-spacing: -.02em; margin: 0; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }

  main {
    flex: 1;
    min-height: 0;                 /* let the canvas shrink instead of pushing */
    display: grid;
    grid-template-columns: 320px 1fr;
    /* An auto grid row grows to fit its content, so without this the row takes
       its height from the canvas's own square bitmap and the bottom of the
       picture ends up below the window. minmax(0,1fr) pins the row to the
       height that is actually available and lets everything inside shrink. */
    grid-template-rows: minmax(0, 1fr);
    gap: 1rem;
  }

  .panel {
    border: 1px solid var(--line); background: #fff; border-radius: 9px;
    padding: .75rem; display: flex; flex-direction: column; gap: .5rem;
    /* On a short window the controls are what runs out of room first. Let the
       panel scroll inside itself rather than pushing the page taller: the
       picture stays whole and the page still never scrolls. */
    min-height: 0; overflow-y: auto;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  label { display: flex; justify-content: space-between; align-items: baseline;
          font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
          color: var(--dim); margin-bottom: .15rem; }
  label b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600;
            font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--thread); margin: 0; height: 16px; }
  input[type=file], input[type=number], select {
    width: 100%; padding: .3rem .35rem; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; font: inherit; font-size: 12px;
  }
  input[type=color] { width: 100%; height: 28px; padding: 1px; border: 1px solid var(--line);
                      border-radius: 5px; background: #fff; }
  /* The solver's own knobs are a different kind of thing from the global
     sliders above them, and were being lost among identical grey labels. */
  label.section { border-top: 1px solid var(--line); padding-top: .5rem;
                  margin-top: .15rem; color: var(--thread); font-weight: 600; }
  #algo-params { display: flex; flex-direction: column; gap: .5rem; }
  .check { display: flex; justify-content: flex-start; align-items: center; gap: .4rem;
           font-size: 12px; color: var(--ink); text-transform: none; letter-spacing: 0;
           margin: 0; }
  .check input { width: auto; }
  .buttons { display: grid; grid-template-columns: 2fr 1fr; gap: .5rem; margin-top: auto; }
  button { padding: .55rem .4rem; border: 0; border-radius: 6px; background: var(--ink);
           color: var(--paper); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--thread); }
  button.ghost { background: #fff; color: var(--dim); border: 1px solid var(--line);
                 font-weight: 400; }
  button.ghost:hover { color: var(--thread); border-color: var(--thread); }

  /* source, then the result, then the numbers: left to right */
  .stage { display: grid; grid-template-columns: 130px 1fr 300px;
           grid-template-rows: minmax(0, 1fr); gap: .9rem; min-height: 0; }
  figure { margin: 0; display: flex; flex-direction: column; gap: .25rem; min-height: 0; }
  figcaption { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
               color: var(--dim); flex: none; }
  /* The single grid cell has to be pinned to the frame's own size. Left as
     auto it takes its height from the canvas, while the canvas is asking for
     100% of it -- a cycle the browser breaks by falling back to the canvas's
     square bitmap ratio, which is then taller than the frame and gets its
     bottom clipped. Pinning the cell makes the canvas exactly the frame, and
     object-fit letterboxes the square picture inside it. */
  .frame { border: 1px solid var(--line); border-radius: 9px; background: #fff;
           display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr);
           place-items: stretch; overflow: hidden; aspect-ratio: 1; }
  /* the canvas is whatever the solver rendered; let it fill the frame rather
     than sit at its intrinsic pixel size */
  .frame img, .frame canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* The board is always on screen, wound or not, so the page does not jump
     when a result arrives and you can see what you are about to fill. Sizing
     it from the column width rather than its own height keeps it from
     overflowing across the source thumbnail. */
  figure.source .frame { width: 100%; }
  figure.wound { min-width: 0; height: 100%; }
  figure.wound .frame { flex: 1; min-height: 0; width: 100%; aspect-ratio: auto; }

  /* Two views of the same winding. Styled as a control rather than as a
     caption: the first version looked exactly like the SOURCE label above it
     and nobody could find it. */
  figure.wound > figcaption { display: inline-flex; align-self: flex-start; gap: 2px;
                              border: 1px solid var(--line); border-radius: 7px;
                              padding: 2px; background: #fff; }
  .tab { background: none; border: 0; margin: 0; width: auto; cursor: pointer;
         font: inherit; font-size: 11.5px; font-weight: 500; letter-spacing: 0;
         text-transform: none; color: var(--dim); padding: .2rem .7rem;
         border-radius: 5px; }
  .tab:hover { background: var(--paper); color: var(--thread); }
  .tab.on { background: var(--ink); color: var(--paper); font-weight: 600; }
  .tab.on:hover { background: var(--ink); color: var(--paper); }
  #pane-three { position: relative; }
  #three-host { position: absolute; inset: 0; }
  .three-bar { position: absolute; left: .6rem; right: .6rem; bottom: .5rem;
               display: flex; align-items: center; gap: .6rem; }
  .three-bar input { flex: 1; }
  #three-note { font-size: 11px; color: var(--dim); white-space: nowrap; }

  .readout { display: flex; flex-direction: column; gap: .55rem; min-height: 0;
             border-left: 1px solid var(--line); padding-left: .9rem; }
  .stat { font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 10px; text-transform: uppercase;
               letter-spacing: .07em; color: var(--dim); }
  .stat b { font-size: 1.05rem; font-weight: 600; }
  /* using the least thread is the point of the whole thing, so it leads */
  .stat.headline { padding-bottom: .55rem; border-bottom: 1px solid var(--line); }
  .stat.headline b { font-size: 1.8rem; color: var(--thread); letter-spacing: -.02em;
                     display: block; line-height: 1.1; }
  .stat.headline em { display: block; font-style: normal; font-size: 11px; color: var(--dim); }
  .rest { display: flex; gap: 1.1rem; }
  .readout input[type=number] { margin-top: .1rem; }
  .palette { display: flex; gap: .25rem; min-height: 22px; flex-wrap: wrap; }
  .chip { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }
  .downloads { display: flex; flex-direction: column; gap: .3rem; margin-top: auto; }
  .downloads a { font-size: 12px; color: var(--thread); }
  #status { color: var(--dim); font-size: 12px; margin: 0; }
  .explain { min-height: 0; overflow-y: auto; border-top: 1px solid var(--line);
             padding-top: .5rem; }
  #algo-summary { margin: 0 0 .4rem; font-size: 12px; color: var(--ink); }
  #algo-maths { margin: 0; font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                color: var(--dim); white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>String Art</h1>
  <p>One continuous thread between pins. Opaque thread; the palette is clustered from your image.</p>
</header>

<main>
  <form class="panel" onsubmit="return false">
    <div>
      <label for="file">Image</label>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="pair">
      <div>
        <label for="algorithm">Solver</label>
        <select id="algorithm">
          <option value="greedy">Greedy (baseline)</option>
          <option value="lookahead">Lookahead</option>
          <option value="orthogonal">Orthogonal (re-colours)</option>
          <option value="descent">Descent</option>
          <option value="surrogate">Surrogate</option>
          <option value="soft">Soft assignment</option>
          <option value="anneal">Anneal</option>
          <option value="dither">Dither</option>
          <option value="palette">Palette (re-fits colours)</option>
          <option value="layers">Layers (strand order)</option>
        </select>
      </div>
      <div>
        <label for="mode">Thread</label>
        <select id="mode">
          <option value="grayscale">Black only</option>
          <option value="colour">From the image</option>
        </select>
      </div>
    </div>
    <div class="pair">
      <div><label for="pins">Pins <b id="out-pins"></b></label>
        <input type="range" id="pins" min="60" max="360" step="4" value="180"></div>
      <div><label for="lines">Chords <b id="out-lines"></b></label>
        <input type="range" id="lines" min="100" max="8000" step="100" value="1500"></div>
    </div>
    <div class="pair">
      <div><label for="opacity">Darkness <b id="out-opacity"></b></label>
        <input type="range" id="opacity" min="0.05" max="0.5" step="0.01" value="0.18"></div>
      <div><label for="gap">Min span <b id="out-gap"></b></label>
        <input type="range" id="gap" min="1" max="40" step="1" value="1"></div>
    </div>
    <div class="pair">
      <div><label for="size">Solve detail <b id="out-size"></b></label>
        <input type="range" id="size" min="160" max="400" step="20" value="220"></div>
      <div><label for="colours">Colours <b id="out-colours"></b></label>
        <input type="range" id="colours" min="2" max="12" step="1" value="6"></div>
    </div>
    <div class="pair">
      <div><label for="economy">Economy <b id="out-economy"></b></label>
        <input type="range" id="economy" min="0" max="0.05" step="0.005" value="0"></div>
      <div><label for="canvas">Canvas px <b id="out-canvas"></b></label>
        <input type="range" id="canvas" min="300" max="1600" step="100" value="700"></div>
    </div>
    <!-- whatever the chosen solver actually takes, built from Algo -->
    <div id="algo-params"></div>
    <div>
      <label>Thread to buy</label>
      <div id="palette" class="palette"></div>
    </div>
    <div class="buttons">
      <button id="run" type="button">Wind</button>
      <button id="baseline" class="ghost" type="button">Baseline</button>
    </div>
  </form>

  <section class="stage">
    <figure class="source">
      <figcaption>Source</figcaption>
      <div class="frame" id="source"></div>
    </figure>
    <figure class="wound">
      <figcaption>
        <button type="button" id="tab-flat" class="tab on">Wound</button>
        <button type="button" id="tab-three" class="tab">In 3D</button>
      </figcaption>
      <div class="frame" id="pane-flat"><canvas id="result" width="660" height="660"></canvas></div>
      <div class="frame hidden" id="pane-three">
        <div id="three-host"></div>
        <div class="three-bar">
          <input type="range" id="three-scrub" min="0" max="1" step="1" value="1">
          <span id="three-note"></span>
        </div>
      </div>
    </figure>
    <aside class="readout">
      <div class="stat headline">
        <span>Thread used</span><b id="stat-thread">—</b><em id="stat-thread-note"></em>
      </div>
      <div class="stat">
        <label for="diameter">Frame across (m)</label>
        <input type="number" id="diameter" min="0.1" max="3" step="0.05" value="0.6">
      </div>
      <div class="rest">
        <div class="stat"><span>Chords</span><b id="stat-chords">—</b></div>
        <div class="stat"><span>Tie-offs</span><b id="stat-cuts">—</b></div>
      </div>
      <div class="stat"><span>Likeness</span><b id="stat-match">—</b></div>
      <p id="status">Pick an image to begin.</p>
      <div class="explain">
        <p id="algo-summary"></p>
        <pre id="algo-maths"></pre>
      </div>
      <div class="downloads">
        <a id="dl-svg" class="hidden">Download SVG</a>
        <a id="dl-seq" class="hidden">Winding instructions</a>
      </div>
    </aside>
  </section>
</main>
<canvas id="work" style="display:none"></canvas>
<script src="app.bc.js"></script>
<script type="module" src="three-view.js"></script>
</body>
</html>
