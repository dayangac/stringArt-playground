# The app is entirely client side -- js_of_ocaml for the solvers, esbuild for
# the 3D view -- so it can be served as static files. Building here rather than
# committing app.bc.js keeps three megabytes of generated JavaScript out of the
# repository.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Bundle the 3D view
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - name: Install the browser dependencies
        run: opam install -y js_of_ocaml js_of_ocaml-compiler js_of_ocaml-ppx brr

      # only the web target: the tests need alcotest and qcheck, and nothing
      # here runs them
      - name: Build the page
        run: opam exec -- dune build @web/default

      - name: Collect what gets served
        run: |
          mkdir -p site
          cp _build/default/web/index.html _build/default/web/app.bc.js \
             _build/default/web/three-view.js site/
          touch site/.nojekyll
          ls -lh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
